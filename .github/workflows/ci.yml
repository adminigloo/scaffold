name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, for the changeset-coverage step at the end. `changeset
      # status --since` needs the base ref present, and a shallow clone has
      # none — it would report "no packages changed" and pass, which is the
      # worst possible answer from a check like that.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # A stale lockfile fails here with a clear message rather than three
      # steps later as a missing module. It has happened twice.
      - run: pnpm install --frozen-lockfile

      # BUILD FIRST. Packages resolve each other's types from dist/index.d.ts,
      # which is gitignored and absent on a fresh checkout. Typecheck-first
      # passes on a machine with stale build output and fails only in CI.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # EVERY CHANGED PACKAGE CARRIES A CHANGESET, checked rather than
      # remembered. "Changeset per package touched" is a house rule with
      # fourteen published packages behind it, and the failure mode of forgetting
      # one is not a missing changelog entry: the package is not versioned, not
      # published, and `PACKAGE_VERSIONS` in the generator then pins a range the
      # registry cannot satisfy. That is how a generator comes to emit projects
      # that will not install.
      #
      # Pull requests only. On a push to main there is no base to compare
      # against, and `--since` needs one.
      - name: Every changed package carries a changeset
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          pnpm changeset status --since="origin/${{ github.base_ref }}" --verbose

  api-surface:
    name: what the published API gained and lost
    runs-on: ubuntu-latest
    needs: check
    # Only on a pull request: the check is a comparison against the base of a
    # proposed change, and there is nothing to compare a push to main against.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      # FULL HISTORY. The tool builds the base ref as well as the head, and a
      # shallow clone has no base ref to build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # FOURTEEN PUBLISHED PACKAGES, changesets, and until now nothing checking
      # that a `patch` did not delete an exported type. Every export is a
      # permanent API commitment; that is only true if removing one is visible
      # before it ships rather than in a client's build a week later.
      #
      # It snapshots the .d.ts surface either side of the change and posts the
      # difference as a table on the pull request, so the reviewer sees what was
      # added and what disappeared without reading a diff of generated types.
      #
      # `fail-on-breaking` is ON. A genuine breaking change is not blocked
      # forever — it is acknowledged in `break-check.config.json`, which makes
      # the decision a reviewed commit instead of somebody clicking past a
      # warning. That is the point.
      #
      # The config sets `checkVersionBump: false`, and that is not a weakening.
      # Under changesets the version in package.json is bumped by the release
      # pull request, not by the pull request that changes the code, so a
      # version-against-severity comparison on a feature branch is always
      # comparing against a version that has not moved yet. It would fire on
      # every honest change and teach everyone to ignore it. What this job
      # consumes is the severity; matching the changeset to it is the author's
      # job, and the table is what makes that possible.
      #
      # `create-app` is deliberately not in the package list. It publishes a
      # binary and a template directory, tsup emits no declarations for it, and
      # a package with no type surface is not something this tool can compare.
      - uses: clerk/break-check@v1
        with:
          config-path: break-check.config.json
          setup-command: pnpm install --frozen-lockfile && pnpm build
          fail-on-breaking: true
          comment: true

  generate:
    name: generate a project, build it, and run its suite
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: read

    # A REAL POSTGRES, because the generated project's integration suites assert
    # things only Postgres can enforce — a primary key that arbitrates a claim
    # between two connections, a NOT NULL that rejects a row, `NULL = '*'`
    # evaluating to UNKNOWN. Mocking any of that would be asserting the mock.
    #
    # Those suites shipped for a release with nothing running them: they need
    # DATABASE_URL, nothing set it, `describeIntegration` reported a neat green
    # "skipped", and two of them contradicted the code they were testing from
    # the day they were committed. A service container is the cheapest way to
    # make that impossible, and it needs no account and no secret — which
    # matters, because the reason the alternative was never done is that a Neon
    # branch per run costs a credential somebody has to own.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        # Without the health check the first step to connect races the
        # container's own start-up, and the failure looks like a broken test.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@adminigloo"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @adminigloo/create-app build

      # The end-to-end test that unit tests cannot do. It runs the generator for
      # real, installs the PUBLISHED packages from the registry, and builds the
      # result — which is exactly what someone starting a project experiences.
      #
      # This exists because two defects reached a tagged release that every unit
      # test passed through: the generated app had no tRPC client provider, so no
      # component could call the API, and src/db/schema.ts omitted three
      # packages' tables, so they were missing from every migration. Both were
      # only visible by generating a project and building it.
      - name: Generate a full project
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e
          node "$GITHUB_WORKSPACE/packages/create-app/dist/index.js" \
            e2e-app --yes --model both --admin full --ai --email

      - name: Install the generated project
        working-directory: /tmp/e2e/e2e-app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck the generated project
        working-directory: /tmp/e2e/e2e-app
        run: pnpm exec tsc --noEmit

      # THE ONLY PLACE MOST OF THESE TESTS RUN. `pnpm -r test` at the root
      # excludes `template/` and `overlays/` because to the generator they are
      # data — text it renders — so the stripe overlay's suite, the AI route's
      # suite and every test the base template ships execute here and nowhere
      # else. Before this step they executed nowhere at all, and the monorepo
      # was fully green through a product builder on which no product could be
      # published.
      #
      # Unit only, and before the build: it needs no database and no artifact,
      # and a failing assertion should be reported as a failing assertion rather
      # than as whatever the bundler makes of it. The integration half runs at
      # the end, once there is a schema to run it against.
      - name: Test the generated project — unit
        working-directory: /tmp/e2e/e2e-app
        run: pnpm exec vitest run --project=unit

      # Placeholder credentials. Every value is shaped correctly so the boot
      # validation genuinely runs — a build that passes because validation was
      # skipped proves nothing about the contract this scaffold exists to
      # enforce. Nothing here reaches a network.
      - name: Build the generated project
        working-directory: /tmp/e2e/e2e-app
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          DATABASE_URL=postgresql://u:p@ep-ci-pooler.us-east-2.aws.neon.tech/db
          DATABASE_URL_UNPOOLED=postgresql://u:p@ep-ci.us-east-2.aws.neon.tech/db
          CLERK_SECRET_KEY=sk_test_0000000000000000000000000000
          CLERK_WEBHOOK_SIGNING_SECRET=whsec_0000000000000000000000000000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_0000000000000000000000000000
          STRIPE_SECRET_KEY=sk_test_1111111111111111111111111111
          STRIPE_WEBHOOK_SECRET=whsec_1111111111111111111111111111
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_1111111111111111111111111111
          RESEND_API_KEY=re_22222222222222222222222222
          EMAIL_FROM=CI <ci@example.com>
          ANTHROPIC_API_KEY=sk-ant-api03-3333333333333333333333333
          EOF
          pnpm exec next build

      # THE STEP THAT WOULD HAVE CAUGHT IT. `tsc --noEmit` and `vitest run` were
      # both green on a configuration that could not serve a single page: the
      # invitation template reached `react-dom/server` through React Email, and
      # nothing a type checker or a plan-level test looks at knows what Next's
      # React Server Component boundary forbids. A project that compiles and
      # 500s is not a project, so the build is no longer the last word — the
      # server has to answer.
      #
      # Both modes, and they are not the same test. `next start` serves the
      # artifact the step above produced; `next dev` compiles each route on
      # first request through a different path, and it is the one every
      # developer meets first. Before the live-key step, which deliberately
      # leaves a failed build behind it.
      - name: Serve the generated project
        working-directory: /tmp/e2e/e2e-app
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/route-sweep.sh" \
            /tmp/e2e/e2e-app "next start" 3000 pnpm exec next start -p 3000
          bash "$GITHUB_WORKSPACE/.github/scripts/route-sweep.sh" \
            /tmp/e2e/e2e-app "next dev" 3001 pnpm exec next dev -p 3001

      # The guarantee this whole scaffold exists to provide. If a live key ever
      # stops failing the build, that is the most important regression here.
      - name: A live key must refuse to build
        working-directory: /tmp/e2e/e2e-app
        run: |
          # Assembled from parts on purpose. Written as a literal, this trips
          # GitHub push protection, which cannot tell a deliberately fake live
          # key from a real one — and it is right not to try.
          MODE=live
          sed -i "s/^STRIPE_SECRET_KEY=.*/STRIPE_SECRET_KEY=sk_${MODE}_9999999999999999999999999999/" .env.local
          if SKIP_ENV_VALIDATION=1 pnpm exec next build > out.log 2>&1; then
            echo "::error::A live Stripe key built successfully. The mode assertion is broken."
            exit 1
          fi
          grep -q "KeyModeMismatchError" out.log || {
            echo "::error::Build failed, but not with KeyModeMismatchError:"
            tail -20 out.log
            exit 1
          }
          echo "Live key correctly refused, even with SKIP_ENV_VALIDATION=1."

      # Proves the composed schema is complete: one migration covering every
      # table from every installed package.
      - name: Generate migrations from the composed schema
        working-directory: /tmp/e2e/e2e-app
        run: |
          sed -i 's/^STRIPE_SECRET_KEY=.*/STRIPE_SECRET_KEY=sk_test_1111111111111111111111111111/' .env.local
          set -a && . ./.env.local && set +a
          pnpm exec drizzle-kit generate
          tables=$(grep -c "CREATE TABLE" drizzle/*.sql)
          echo "migration covers $tables tables"
          [ "$tables" -ge 14 ] || {
            echo "::error::Expected at least 14 tables, found $tables — a package's schema is missing from src/db/schema.ts"
            exit 1
          }

      # AND THEN APPLY IT, which is a different claim. A migration that
      # `drizzle-kit generate` is willing to write is not necessarily one
      # Postgres is willing to run — a bigint default broke every migration in
      # this scaffold once, and the generate step was green throughout.
      #
      # `psql` rather than `pnpm db:migrate`. drizzle-kit picks its driver from
      # what is installed, finds `@neondatabase/serverless`, and then cannot
      # reach a plain listener for the same reason the app cannot — it hangs
      # rather than failing, which is worse. The file is the artifact under
      # test and this executes it verbatim; the migration journal it skips is
      # bookkeeping for a deploy, and nothing below reads it.
      - name: Apply the migration to a real Postgres
        working-directory: /tmp/e2e/e2e-app
        env:
          PGPASSWORD: app
        run: |
          for sql in drizzle/*.sql; do
            echo "applying $sql"
            psql -v ON_ERROR_STOP=1 -h localhost -U app -d app -f "$sql"
          done
          tables=$(psql -tAq -h localhost -U app -d app -c \
            "select count(*) from information_schema.tables where table_schema='public'")
          echo "$tables tables now exist"
          [ "$tables" -ge 14 ] || {
            echo "::error::the migration ran and left $tables tables behind"
            exit 1
          }

      # The bridge the APP needs, which drizzle-kit did not. Every generated
      # project reaches its database through @neondatabase/serverless, which
      # carries the wire protocol over a WebSocket and therefore cannot dial a
      # plain listener at all. See .github/scripts/ws-proxy.mjs, including why
      # it is told its target rather than reading it out of the address.
      - name: Bridge the Neon driver to it
        env:
          WS_PROXY_TARGET: 127.0.0.1:5432
        run: |
          mkdir -p /tmp/wsproxy
          npm install ws --prefix /tmp/wsproxy --no-audit --no-fund
          cd /tmp/wsproxy
          node "$GITHUB_WORKSPACE/.github/scripts/ws-proxy.mjs" 5433 &
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5433/ > /dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "::error::the WebSocket bridge never came up"
          exit 1

      # THE ROLE TEMPLATES, because `grantBootstrapAdminIfFirst` grants a
      # template and there is nothing to grant without them. The bootstrap suite
      # says so itself rather than failing an assertion, which is the right
      # behaviour and still a red run — so seed first.
      #
      # DATABASE_URL names a pooled endpoint THAT DOES NOT RESOLVE, on purpose.
      # Boot validation refuses a DATABASE_URL without `-pooler` in the host,
      # and it should: migrating through a pooler misreports what has been
      # applied. Nothing resolves this name — the bridge above already knows
      # where the database is.
      - name: Seed the role catalog
        working-directory: /tmp/e2e/e2e-app
        env:
          DATABASE_URL: postgres://app:app@ci-pooler.invalid:5432/app
          DATABASE_URL_UNPOOLED: postgres://app:app@localhost:5432/app
          DATABASE_WS_PROXY: 127.0.0.1:5433/v1
        run: pnpm db:seed

      # THE STEP THESE SUITES WERE WRITTEN FOR AND NEVER GOT.
      #
      # REQUIRE_DATABASE=1 is the important half. Without it, a run whose
      # database failed to appear skips every integration suite and reports
      # success — which is exactly how this hole stayed open for a release. With
      # it, `describeIntegration` refuses to skip: each suite becomes a single
      # failing test that names itself. A pipeline that meant to run these
      # cannot pass by not running them.
      #
      # The variables are set on the step rather than written into .env.local
      # because `src/test/setup.ts` loads that file with `process.loadEnvFile`,
      # which leaves an already-set variable alone. So these win, and the
      # placeholder Neon URLs the build steps above rely on stay where they are.
      - name: Test the generated project — integration, against that Postgres
        working-directory: /tmp/e2e/e2e-app
        env:
          # Repeated rather than anchored: GitHub Actions does not resolve YAML
          # anchors, and a `<<:` merge key reaches the runner as a literal.
          DATABASE_URL: postgres://app:app@ci-pooler.invalid:5432/app
          DATABASE_URL_UNPOOLED: postgres://app:app@localhost:5432/app
          DATABASE_WS_PROXY: 127.0.0.1:5433/v1
          REQUIRE_DATABASE: "1"
        run: pnpm exec vitest run --project=integration
