name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BUILD FIRST. Packages resolve each other's types from dist/index.d.ts,
      # which does not exist on a fresh checkout — dist is gitignored. Running
      # typecheck first passes on a developer machine that happens to have
      # stale build output and fails in CI, which is the worst ordering of the
      # two. `pnpm -r build` walks the workspace in dependency order.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
