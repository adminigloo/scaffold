name: Generator matrix

# THE ADDITIVE-OVERLAY RULE, ACTUALLY VERIFIED.
#
# `OverlayCollisionError` proves that no two overlays write the same path. That
# is a much weaker statement than it looks: it says the file sets are disjoint,
# and says nothing whatever about whether a given combination typechecks,
# resolves its imports, or builds. The failure mode of additive overlays is
# exactly the combination nobody ever generated — which is how a hardcoded
# `/admin` link survived in a project generated with `--admin none`, and how the
# product builder once emitted admin pages into a project that had deliberately
# declined an admin panel.
#
# Six combinations, chosen to cover six DISTINCT overlay sets rather than six
# plausible-looking products. The degenerate corners are in on purpose: nobody
# generates `--model none --admin none` by hand, so nobody finds out that every
# generated list is empty in it until a client does.
#
# `both / full / --ai --email` is deliberately NOT here. The `generate` job in
# ci.yml already builds that maximal combination on every pull request, and a
# nightly slot spent repeating it buys nothing.
#
# NIGHTLY rather than per-PR because each entry is a full `pnpm install` plus
# `next build` against the private registry, and six of those cost more than
# every other job in this repository put together. A regression here is a
# regression in a combination nobody is generating this afternoon.
#
# WHAT IS NOT DEFERRED TO THE NIGHT is whether the generator can EMIT every
# configuration. That question needs no install, no registry and no network —
# only a plan in memory — so `every-configuration.test.ts` asks it of all two
# hundred and forty of them on every commit, in about fourteen seconds. This
# matrix is for the questions that genuinely need a package manager: does the
# combination resolve, typecheck, build and serve. A verifier once found a
# window in which no project with an admin panel could be generated at all, and
# a nightly job is the wrong instrument for a fault with a twenty-five minute
# lifetime.

on:
  schedule:
    # 03:00 UTC. Scheduled workflows only run on the default branch.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# THE TOKEN THE REPOSITORY'S OWN `.npmrc` ASKS FOR, supplied where it is asked
# for rather than in the two steps that happened to need it.
#
# `.npmrc` at the root interpolates `${GITHUB_TOKEN}` for the @adminigloo
# registry, so EVERY pnpm invocation inside the checkout reads it — and until
# now only the generated-project install defined the variable. The other jobs
# printed `WARN Issue while reading .npmrc. Failed to replace env in config:
# ${GITHUB_TOKEN}` ahead of every line of output, which is the kind of noise
# that hides a real error, and they installed successfully only because the
# root workspace resolves every @adminigloo package through `workspace:` and
# never asks the registry for one. That is a property nobody wrote down: add a
# single registry-resolved dependency to the root and the install starts
# failing with a 401 that points at nothing. Defining it here makes the working
# path the declared one.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  generate:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # `shell: bash` rather than the default, and the difference is `pipefail`.
    # GitHub runs an unqualified `run:` as `bash -e`, where `cmd | tee log`
    # reports tee's exit status and a failing compiler behind a tee is a green
    # step. Naming the shell gets `bash --noprofile --norc -eo pipefail`, which
    # is the only reason the steps below can stream their output and keep a
    # copy at the same time.
    defaults:
      run:
        shell: bash

    strategy:
      # EVERY combination reports. The first failure is rarely the informative
      # one — whether the other five also fail is what separates "a package
      # regressed" from "one overlay pairing broke".
      fail-fast: false
      matrix:
        include:
          # Overlays: none at all. The floor, and the emptiest artifact the
          # generator can produce: APP_LINKS is `[]`, there is no /admin and no
          # shop, and tenancy runs on an invisible personal workspace. Every
          # generated list being empty at once is only ever exercised here.
          - id: floor-nothing-installed
            flags: --model none --admin none --no-ai --no-email --tenant-noun none
            overlays: none

          # Overlays: stripe + account + legal. Money with no admin surface
          # anywhere. This is the pairing that catches catalog-admin leaking:
          # the product builder needs something to sell AND somewhere to put it,
          # and it emitted admin pages into projects like this one until it was
          # fixed. `account` and `legal` come along because anything that can be
          # bought needs somewhere the buyer can see it afterwards and a public
          # policy page Stripe will accept — both selected on "takes money"
          # alone, which is what makes this entry cover them without an admin
          # shell underneath.
          - id: money-without-admin
            flags: --model both --admin none --no-ai --no-email
            overlays: stripe, account, legal

          # Overlays: admin-minimal + admin-full. An admin shell with nothing to
          # sell. Every admin page must hold up with no catalog, no orders and
          # no Stripe package installed at all.
          - id: admin-without-money
            flags: --model none --admin full --no-ai --no-email
            overlays: admin-minimal, admin-full

          # Overlays: email + ai. The mail templates and /setup/email standing
          # with no admin sidebar to hang off and no storefront — the footer
          # link is the page's only way in — and the streaming assistant beside
          # them, which is the only place `--ai` without `--model` is built.
          - id: email-alone
            flags: --model none --admin none --ai --email --tenant-noun Workspace
            overlays: email, ai

          # Overlays: admin-minimal + stripe + catalog-admin + account + email +
          # legal. The subscription path against the MINIMAL shell, which is the
          # shell the product builder is least often seen in.
          - id: subscription-minimal-shell
            flags: --model subscription --admin minimal --no-ai --email --tenant-noun Team
            overlays: admin-minimal, stripe, catalog-admin, account, email, legal

          # Overlays: admin-minimal + admin-full + stripe + catalog-admin +
          # account + ai + legal. The one-time path with the full shell and the
          # AI package, and no email — so the invitation mailer takes its
          # no-Resend branch while everything else is switched on.
          - id: one-time-full-shell
            flags: --model one-time --admin full --ai --no-email --tenant-noun Company
            overlays: admin-minimal, admin-full, stripe, catalog-admin, account, ai, legal

    env:
      # OUTSIDE the workspace, deliberately. pnpm walks up from the directory it
      # is run in looking for a workspace root, so a generated project sitting
      # anywhere under the checkout would find this repository's
      # pnpm-workspace.yaml, join the monorepo, and resolve `catalog:` and
      # `workspace:` links that a real user's project has no access to. It would
      # install and build, and it would be testing the wrong thing.
      APP_DIR: /tmp/matrix/app

    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: pnpm/action-setup@v4
        id: pnpm
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@adminigloo"

      - run: pnpm install --frozen-lockfile
        id: install-workspace
      - run: pnpm --filter @adminigloo/create-app build
        id: build-generator

      - name: Generate
        id: generate
        run: |
          mkdir -p "$(dirname "$APP_DIR")"
          cd "$(dirname "$APP_DIR")"
          node "$GITHUB_WORKSPACE/packages/create-app/dist/index.js" \
            app --yes ${{ matrix.flags }} 2>&1 | tee "$RUNNER_TEMP/generate.log"

      # The generated manifest, in the log. It states the answers, the packages,
      # the overlays and the capabilities this run is meant to have, so a failure
      # further down is read against what the project claimed rather than against
      # the flags somebody has to re-derive from the job name.
      #
      # COMPARED AS A SET, sorted on both sides. `overlayNamesFor` returns its
      # names in selection order, which is an internal detail that carries no
      # meaning here — a reordering there is not a regression, and a matrix that
      # goes red for one teaches everybody to ignore the next honest failure.
      # Membership is the claim: this entry covers exactly these overlays.
      - name: What was generated
        id: what-was-generated
        run: |
          cat "$APP_DIR/adminigloo.json"
          node -e '
            const { readFileSync } = require("node:fs");
            const [, declared, manifestPath, id] = process.argv;
            const asSet = (names) =>
              names.map((n) => n.trim()).filter((n) => n !== "" && n !== "none").sort().join(", ") || "none";
            const expected = asSet(declared.split(","));
            const actual = asSet(JSON.parse(readFileSync(manifestPath, "utf8")).overlays);
            if (expected !== actual) {
              console.log(
                "::error title=" + id + ": overlay set::expected [" + expected + "], generated [" + actual +
                "]. Either overlayNamesFor changed or this matrix entry is stale — and if it is stale, this " +
                "combination has been covering something other than what it says.",
              );
              process.exit(1);
            }
            console.log("overlays: " + actual);
          ' "${{ matrix.overlays }}" "$APP_DIR/adminigloo.json" "${{ matrix.id }}"

      - name: Install
        id: install
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --no-frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/install.log"

      # Placeholder credentials, and a superset of what any combination needs.
      # The values, and the reason every one of them is shaped the way the
      # provider shapes it, live in .github/scripts/ci-credentials.sh — one copy,
      # because ci.yml writes the same file and the two drifted into carrying the
      # same malformed Clerk key.
      # THE UNCONFIGURED BUILD COMES FIRST, AND IT IS NOT AN AFTERTHOUGHT.
      #
      # This job used to run every build and every sweep with an empty
      # `.env.local`, which is why a project that could not build with Clerk
      # configured shipped three times: the one state nobody exercised was the
      # one every paying client is in. Writing the credentials earlier fixed
      # that and created its exact mirror — a pipeline that only ever built the
      # configured app, blind to the credential-free boot that is the scaffold's
      # central promise and the state every new user starts in.
      #
      # Both, then. This step proves `pnpm install && pnpm dev` works on a
      # laptop with nothing set; the configured build below proves a real
      # deployment works. Neither substitutes for the other, and the asymmetry
      # in either direction is invisible until somebody hits it.
      - name: Build — no credentials
        id: build_bare
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec next build 2>&1 | tee "$RUNNER_TEMP/build-bare.log"

      - name: Serve — no credentials
        id: serve_bare
        working-directory: ${{ env.APP_DIR }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/route-sweep.sh"             "$APP_DIR" "next start (no credentials)" 3000 pnpm exec next start -p 3000             2>&1 | tee "$RUNNER_TEMP/serve-bare.log"

      - name: Credentials
        id: credentials
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-credentials.sh" "$APP_DIR"

      # BEFORE the build, because `next build` reports a type error wrapped in a
      # bundler failure and tsc reports the file and the line.
      - name: Typecheck
        id: typecheck
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      # Each combination ships a DIFFERENT set of test files, because each ships
      # a different set of overlays, and a suite is only as good as the
      # configurations it has been run in. `--admin none --model both` copies in
      # the stripe overlay's tests with no admin surface underneath them; the
      # per-PR job in ci.yml only ever runs the maximal set.
      #
      # Unit only. The integration suites need a database and this job has none;
      # REQUIRE_DATABASE is deliberately NOT set here, so they skip — and say so
      # in the log, one line per suite.
      - name: Test
        id: test
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec vitest run --project=unit 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build — configured
        id: build
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec next build 2>&1 | tee "$RUNNER_TEMP/build.log"

      # A COMBINATION THAT COMPILES AND CANNOT SERVE A PAGE MUST FAIL HERE.
      # Everything above this line — install, typecheck, build — was green on a
      # configuration where every route but `/` answered 500, because none of
      # them crosses Next's React Server Component boundary and that is where
      # the failure lived. The sweep reads the route list off the pages the
      # build emitted, so an overlay that adds a page is covered the day it is
      # added rather than the day somebody remembers to list it.
      #
      # `next start` and not `next dev`: the artifact from the step above is
      # already on disk, so this costs a boot and eighteen requests. The
      # per-PR `generate` job in ci.yml sweeps dev as well, where paying for a
      # cold compile once is worth it.
      - name: Serve — configured
        id: serve
        working-directory: ${{ env.APP_DIR }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/route-sweep.sh" \
            "$APP_DIR" "next start" 3000 pnpm exec next start -p 3000 \
            2>&1 | tee "$RUNNER_TEMP/serve.log"

      # The generated source, so a failure can be reproduced without guessing at
      # the flags. node_modules and .next are excluded; everything else is small.
      - name: Keep the generated project
        id: keep
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ env.APP_DIR }}
            !${{ env.APP_DIR }}/node_modules
            !${{ env.APP_DIR }}/.next

      # WHICH ENTRY, WHICH STEP, AND WHAT IT SAID — at the top of the run page
      # and in the notification, rather than six red dots and an exit code. See
      # report-job-failure.mjs: three days of this matrix failing nightly went
      # unread because nothing in the alert said what had broken.
      - name: Why this entry is red
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
          LOG_DIR: ${{ runner.temp }}
          REPRODUCE: |
            pnpm --filter @adminigloo/create-app build
            node packages/create-app/dist/index.js app --yes ${{ matrix.flags }}
            bash .github/scripts/ci-credentials.sh app
        run: node "$GITHUB_WORKSPACE/.github/scripts/report-job-failure.mjs" "${{ matrix.id }}"
