name: CI

# PULL REQUESTS ONLY, plus a button to run it by hand (create-app 0.44.1).
#
# It used to run on every push to main and staging as well, where deploy.yml's
# `verify` job already runs the same typecheck and tests before it migrates
# anything, so every push paid for both. On Hinderstap that doubling used about
# 40% of a month's Actions minutes (its commit 04d2ca1, 2026-11-14). A pull
# request is where this check earns its minutes: it is the gate branch
# protection requires before a merge (DEPLOYMENT.md), and the merge's own push
# is then checked once, by the deploy.
on:
  pull_request:
  workflow_dispatch:

# A new push to the same pull request makes the run in progress worthless, so
# it is cancelled rather than finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# THE SAME TOKEN deploy.yml uses (TB-DEPLOY-03). .npmrc reads ${GITHUB_TOKEN}
# for the __SCOPE__ registry, and the automatic secrets.GITHUB_TOKEN is scoped
# to THIS repository: it cannot read packages published from another one, so
# `pnpm install` got a 401 here and — with "ci.yml required to pass" on main —
# nothing could ever merge. PACKAGES_READ_TOKEN is a token with read:packages.
env:
  GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "__SCOPE__"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # SKIP_ENV_VALIDATION lets the build run without secrets. It relaxes the
      # Zod pass ONLY — the key-mode assertion still runs on any key present.
      # NEXT_PUBLIC_APP_URL is a placeholder because some modules build a link
      # from it while they load (the staff sign-up link, since create-app
      # 0.42), and with no app URL `next build` dies with "TypeError: Invalid
      # URL" while collecting page data. This build is a check and is never
      # deployed, so a placeholder is right here (found by Hinderstap's first CI run).
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
