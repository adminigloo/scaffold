packages:
  - "packages/*"

onlyBuiltDependencies:
  - esbuild

# ONE PLACE PER DEPENDENCY. Before this, `drizzle-orm` was written out in eleven
# manifests and `zod` in nine, so a version bump was a bulk edit that nobody
# could review — and the failure mode of a missed line is silent. Two packages
# building against two different minors of drizzle produce .d.ts files whose
# column types are structurally incompatible, and the error surfaces in a
# generated project as an unreadable mismatch between two packages that both
# look correct on their own.
#
# Read `catalog:` in a manifest as "whatever the workspace says". pnpm rewrites
# it to the literal range below when the package is packed, so a published
# tarball never carries the protocol.
catalog:
  "@trpc/server": ^11.18.0
  drizzle-orm: ^0.45.2
  stripe: ^22.6.0
  svix: ^1.99.1
  zod: ^4.5.1

# SEPARATE ON PURPOSE, and not a duplicate of the block above. A peer range is
# the compatibility promise made to whoever installs the package; the range
# above is the single version this workspace builds and tests against. They are
# deliberately different — `drizzle-orm` is built against ^0.45.2 and accepts
# ^0.45.0, `zod` is built against v4 and still accepts v3.25+ — and collapsing
# them into one entry would silently narrow every published peer range, which
# is a breaking change for every consumer who is one patch behind.
catalogs:
  peers:
    "@trpc/server": ^11.0.0
    drizzle-orm: ^0.45.0
    stripe: ^22.0.0
    zod: ^3.25.0 || ^4.0.0
